<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNS Changer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Tahoma, sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    min-height: 100vh;
    padding: 20px 15px;
    color: #fff;
  }
  .card {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    padding: 22px;
    max-width: 420px;
    margin: 0 auto;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  h1 { text-align: center; font-size: 20px; margin-bottom: 15px; }
  .status {
    text-align: center;
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 18px;
    background: rgba(0,0,0,0.25);
    font-size: 14px;
    transition: 0.3s;
  }
  .status.on { background: #16a34a; }
  .status.off { background: #b91c1c; }

  .servers { display: grid; gap: 8px; margin-bottom: 18px; }
  .server {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    background: rgba(255,255,255,0.06);
    border-radius: 12px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: 0.2s;
    font-size: 13px;
  }
  .server:hover { background: rgba(255,255,255,0.12); }
  .server.selected {
    border-color: #22d3ee;
    background: rgba(34,211,238,0.15);
  }
  .server .name { font-weight: bold; }
  .server .ip { font-size: 11px; opacity: 0.7; direction: ltr; }

  label { display: block; margin: 10px 0 5px; font-size: 13px; }
  input {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
    text-align: left;
    direction: ltr;
    background: rgba(255,255,255,0.9);
    color: #111;
  }
  .btns { display: flex; gap: 10px; margin-top: 18px; }
  button {
    flex: 1;
    padding: 13px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
  }
  button:active { transform: scale(0.96); }
  .apply { background: #16a34a; color: #fff; }
  .reset { background: #b91c1c; color: #fff; }

  .note {
    font-size: 11px;
    margin-top: 16px;
    text-align: center;
    opacity: 0.65;
    line-height: 1.7;
  }
</style>
</head>
<body>

<div class="card">
  <h1>🌐 تغییر DNS</h1>

  <div class="status off" id="status">وضعیت: DNS پیش‌فرض</div>

  <div class="servers" id="serverList"></div>

  <label>DNS اول</label>
  <input type="text" id="dns1" value="1.1.1.1">

  <label>DNS دوم</label>
  <input type="text" id="dns2" value="1.0.0.1">

  <div class="btns">
    <button class="apply" onclick="applyDNS()">اعمال DNS</button>
    <button class="reset" onclick="resetDNS()">بازنشانی</button>
  </div>

  <p class="note">
    ⚠️ این نسخه فقط DNS رو ذخیره می‌کنه.<br>
    برای اعمال واقعی روی سیستم، نسخه اپلیکیشن لازمه.
  </p>
</div>

<script>
const SERVERS = [
  { name: 'Cloudflare',  d1: '1.1.1.1',     d2: '1.0.0.1' },
  { name: 'Google',      d1: '8.8.8.8',     d2: '8.8.4.4' },
  { name: 'Quad9',       d1: '9.9.9.9',     d2: '149.112.112.112' },
  { name: 'OpenDNS',     d1: '208.67.222.222', d2: '208.67.220.220' },
  { name: 'Shecan',      d1: '178.22.122.100', d2: '185.51.200.2' },
  { name: 'Radar',       d1: '10.202.10.10',  d2: '10.202.10.11' },
  { name: 'Begzar',      d1: '185.55.226.26', d2: '185.55.225.25' },
];

const listEl = document.getElementById('serverList');
const dns1El = document.getElementById('dns1');
const dns2El = document.getElementById('dns2');

SERVERS.forEach(s => {
  const div = document.createElement('div');
  div.className = 'server';
  div.innerHTML = `<span class="name">${s.name}</span><span class="ip">${s.d1}</span>`;
  div.onclick = () => {
    document.querySelectorAll('.server').forEach(x => x.classList.remove('selected'));
    div.classList.add('selected');
    dns1El.value = s.d1;
    dns2El.value = s.d2;
  };
  listEl.appendChild(div);
});

function applyDNS() {
  const d1 = dns1El.value.trim();
  const d2 = dns2El.value.trim();
  if (!isValidIP(d1) || !isValidIP(d2)) {
    alert('آدرس DNS معتبر نیست!');
    return;
  }
  localStorage.setItem('dns1', d1);
  localStorage.setItem('dns2', d2);
  localStorage.setItem('dnsEnabled', 'true');
  updateStatus(true);
  alert('✅ DNS ذخیره شد:\n' + d1 + '\n' + d2);
}

function resetDNS() {
  localStorage.removeItem('dns1');
  localStorage.removeItem('dns2');
  localStorage.setItem('dnsEnabled', 'false');
  dns1El.value = '1.1.1.1';
  dns2El.value = '1.0.0.1';
  document.querySelectorAll('.server').forEach(x => x.classList.remove('selected'));
  updateStatus(false);
}

function isValidIP(ip) {
  return /^(\d{1,3}\.){3}\d{1,3}$/.test(ip) &&
    ip.split('.').every(n => +n >= 0 && +n <= 255);
}

function updateStatus(on) {
  const el = document.getElementById('status');
  if (on) {
    el.className = 'status on';
    el.textContent = '✅ DNS فعال شد';
  } else {
    el.className = 'status off';
    el.textContent = 'وضعیت: DNS پیش‌فرض';
  }
}

(function init() {
  const d1 = localStorage.getItem('dns1');
  const d2 = localStorage.getItem('dns2');
  const enabled = localStorage.getItem('dnsEnabled') === 'true';
  if (d1) dns1El.value = d1;
  if (d2) dns2El.value = d2;
  updateStatus(enabled);
})();
</script>

</body>
</html>
