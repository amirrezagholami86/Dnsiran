<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNS Changer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Tahoma, sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #fff;
  }
  .card {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    padding: 25px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  h1 { text-align: center; margin-bottom: 20px; font-size: 22px; }
  .status {
    text-align: center;
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 15px;
    background: rgba(0,0,0,0.2);
    font-size: 14px;
  }
  .status.on { background: #16a34a; }
  .status.off { background: #dc2626; }
  label { display: block; margin: 12px 0 6px; font-size: 14px; }
  input {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
    text-align: left;
    direction: ltr;
  }
  .btns { display: flex; gap: 10px; margin-top: 20px; }
  button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
  }
  button:active { transform: scale(0.96); }
  .apply { background: #16a34a; color: #fff; }
  .reset { background: #dc2626; color: #fff; }
  .note {
    font-size: 11px;
    margin-top: 15px;
    text-align: center;
    opacity: 0.7;
    line-height: 1.6;
  }
</style>
</head>
<body>

<div class="card">
  <h1>🌐 تغییر DNS</h1>

  <div class="status off" id="status">وضعیت: DNS پیش‌فرض</div>

  <label>DNS اول (Primary)</label>
  <input type="text" id="dns1" value="1.1.1.1" placeholder="1.1.1.1">

  <label>DNS دوم (Secondary)</label>
  <input type="text" id="dns2" value="1.0.0.1" placeholder="1.0.0.1">

  <div class="btns">
    <button class="apply" onclick="applyDNS()">اعمال DNS</button>
    <button class="reset" onclick="resetDNS()">بازنشانی</button>
  </div>

  <p class="note">
    ⚠️ این نسخه فقط DNS رو ذخیره می‌کنه.<br>
    برای اعمال واقعی روی سیستم، نسخه اپلیکیشن لازمه.
  </p>
</div>

<script>
function applyDNS() {
  const d1 = document.getElementById('dns1').value.trim();
  const d2 = document.getElementById('dns2').value.trim();

  if (!isValidIP(d1) || !isValidIP(d2)) {
    alert('آدرس DNS معتبر نیست!');
    return;
  }

  localStorage.setItem('dns1', d1);
  localStorage.setItem('dns2', d2);
  localStorage.setItem('dnsEnabled', 'true');

  updateStatus(true);
  alert('✅ DNS ذخیره شد:\n' + d1 + '\n' + d2);
}

function resetDNS() {
  localStorage.removeItem('dns1');
  localStorage.removeItem('dns2');
  localStorage.setItem('dnsEnabled', 'false');

  document.getElementById('dns1').value = '1.1.1.1';
  document.getElementById('dns2').value = '1.0.0.1';

  updateStatus(false);
}

function isValidIP(ip) {
  return /^(\d{1,3}\.){3}\d{1,3}$/.test(ip) &&
    ip.split('.').every(n => +n >= 0 && +n <= 255);
}

function updateStatus(on) {
  const el = document.getElementById('status');
  if (on) {
    el.className = 'status on';
    el.textContent = '✅ DNS فعال شد';
  } else {
    el.className = 'status off';
    el.textContent = 'وضعیت: DNS پیش‌فرض';
  }
}

// بازیابی وضعیت ذخیره‌شده
(function init() {
  const d1 = localStorage.getItem('dns1');
  const d2 = localStorage.getItem('dns2');
  const enabled = localStorage.getItem('dnsEnabled') === 'true';
  if (d1) document.getElementById('dns1').value = d1;
  if (d2) document.getElementById('dns2').value = d2;
  updateStatus(enabled);
})();
</script>

</body>
  </html>
